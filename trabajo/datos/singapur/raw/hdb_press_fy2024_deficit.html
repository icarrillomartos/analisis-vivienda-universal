<!DOCTYPE html><html lang="en"><head><meta charSet="utf-8" data-next-head=""/><meta name="viewport" content="width=device-width" data-next-head=""/><title data-next-head="">HDB Spent Over $6 Billion in FY 2024 to Keep Public Housing Affordable and Liveable</title><meta name="description" content="In the Financial Year (FY) 2024, HDB incurred a net deficit of $6.34 billion before government grants. Of this, $5.51 billion was incurred for the Home Ownership segment, covering the development and sale of flats and disbursement of housing grants to eligible households of new and resale flats. Another $532 million was spent on various rejuvenation and upgrading programmes to revitalise HDB towns and flats." data-next-head=""/><link rel="icon" href="https://www.hdb.gov.sg/favicon.ico" data-next-head=""/><link rel="icon" href="https://www.hdb.gov.sg/hdb-logo.png" data-next-head=""/><link rel="apple-touch-icon" href="https://www.hdb.gov.sg/hdb-logo.png" data-next-head=""/><link rel="preload" href="https://www.hdb.gov.sg/_next/static/css/c9970d39ca9774fe.css" as="style"/><link rel="stylesheet" href="https://www.hdb.gov.sg/_next/static/css/c9970d39ca9774fe.css" data-n-g=""/><link rel="preload" href="https://www.hdb.gov.sg/_next/static/css/a90d700a8489da88.css" as="style"/><link rel="stylesheet" href="https://www.hdb.gov.sg/_next/static/css/a90d700a8489da88.css" data-n-p=""/><noscript data-n-css=""></noscript><script defer="" nomodule="" src="https://www.hdb.gov.sg/_next/static/chunks/polyfills-42372ed130431b0a.js"></script><script id="sitecore-visitor-identification" src="/layouts/system/VisitorIdentification.js" defer="" data-nscript="beforeInteractive"></script><script src="https://www.hdb.gov.sg/_next/static/chunks/webpack-a98ac00363bd9db1.js" defer=""></script><script src="https://www.hdb.gov.sg/_next/static/chunks/framework-4940c3bc569e24f3.js" defer=""></script><script src="https://www.hdb.gov.sg/_next/static/chunks/main-3700ad7ecf55fc5b.js" defer=""></script><script src and flats."},"navigationTitle":{"value":"HDB Spent Over $6 Billion in FY 2024 to Keep Public Housing Affordable and Liveable"},"pageDescrition":{"value":"In the Financial Year (FY) 2024, HDB incurred a net deficit of $6.34 billion before government grants. Of this, $5.51 billion was incurred for the Home Ownership segment, covering the development and sale of flats and disbursement of housing grants to eligible households of new and resale flats. Another $532 million was spent on various rejuvenation and upgrading programmes to revitalise HDB towns and flats."},"pageTitle":{"value":"HDB Spent Over $6 Billion in FY 2024 to Keep Public Housing Affordable and Liveable"}},"databaseName":"web","deviceId":"fe5d7fdf-89c0-4d99-9aa3-b5fbd009c9f3","itemId":"0ae3b2bb-39ab-4348-9a9a-ab461f07962a","itemLanguage":"en","itemVersion":1,"layoutId":"af038be7-4964-5e5b-8587-c77df5a9ad86","templateId":"69b30267-a6b6-52fa-9533-4766acd90000","templateName":"Destination Page","placeholders":{"homepage":[],"jss-main":[{"uid":"28a1fc07-1fad-4a51-a53d-26ce6801cd88","componentName":"PageHeader","dataSource":"{0AE3B2BB-39AB-4348-9A9A-AB461F07962A}","fields":{"hidePage":{"value":false},"publishedDate":{"value":"2025-11-10T16:00:00Z"},"sidebar":{"value":false},"topicTags":[],"metaDescription":{"value":"In the Financial Year (FY) 2024, HDB incurred a net deficit of $6.34 billion before government grants. Of this, $5.51 billion was incurred for the Home Ownership segment, covering the development and sale of flats and disbursement of housing grants to eligible households of new and resale flats. Another $532 million was spent on various rejuvenation and upgrading programmes to revitalise HDB towns and flats."},"navigationTitle":{"value":"HDB Spent Over $6 Billion in FY 2024 to Keep Public Housing Affordable and Liveable"},"pageDescrition":{"value":"In the Financial Year (FY) 2024, HDB incurred a net deficit of $6.34 billion before government grants. Of this, $5.51 billion was incurred for the Home Ownership segment, covering the development and sale of flats and disbursement of housing grants to eligible households of new and resale flats. Another $532 million was spent on various rejuvenation and upgrading programmes to revitalise HDB towns and flats."},"pageTitle":{"value":"HDB Spent Over $6 Billion in FY 2024 to Keep Public Housing Affordable and Liveable"}}}],"intent-landing-page":[],"destination-page":[{"uid":"a7db1256-0d87-46f8-8d6c-15c44d91ca9e","componentName":"BodyContent","dataSource":"{7E510354-DB72-4B58-8D33-4D13E47BEAF8}","fields":{"bodyContent":{"value":"\u003cp\u003e\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eIn the Financial Year (FY) 2024, HDB incurred a net deficit of $6.34 billion before government grants. Of this, $5.51 billion was incurred for the Home Ownership segment, covering the development and sale of flats and disbursement of housing grants to eligible households of new and resale flats. Another $532 million was spent on various rejuvenation and upgrading programmes to revitalise HDB towns and flats.\u003c/p\u003e\n\u003cp\u003e2\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eHDB Chief Executive Officer Mr Tan Meng Dui said: \"Our substantial deficit in FY 2024 reflects our unwavering commitment to providing affordable and quality homes for Singaporeans. During the FY, we continued to roll out a steady supply of Build-To-Order (BTO) flats, commencing construction on about 23,600 flats to meet housing demand.  At the same time, as our towns and flats age, we are also investing heavily to upgrade them, with $532 million spent on upgrading programmes to keep HDB estates vibrant and flats liveable.\u0026rdquo;\u003c/p\u003e\n\u003ch4\u003eSupporting Singaporeans\u0026rsquo; Housing Needs\u003c/h4\u003e\n\u003cp\u003e3\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eHDB incurs a significant deficit every year, as the amount collected from the sale of flats is lower than the total development cost of BTO flats and housing grants disbursed. The $5.51 billion deficit incurred for the Home Ownership segment in FY 2024 was mainly from gross loss on the sale of flats, expected losses on flats currently under development, and disbursement of CPF Housing Grants.\u003c/p\u003e\n\u003cp style=\"text-align: center;\"\u003e\u003cspan style=\"text-decoration: underline;\"\u003eTable 1: Key drivers of Home Ownership Segment for FY 2024\u003c/span\u003e\u003c/p\u003e\n\n\n\u003ctable\u003e\n    \u003ctbody\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e\u003cstrong\u003eGross loss on the sale of flats\u003c/strong\u003e\u003c/td\u003e\n            \u003ctd\u003eGross loss of $1.77 billion for 14,900 flat sales completed (keys issued to buyers) in FY 2024. \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e\u003cstrong\u003eExpected loss for flats currently under development after releasing provisions for completed sales\u003c/strong\u003e\u003c/td\u003e\n            \u003ctd\u003e After the release of provisions made for completed sales, HDB recorded $2.69 billion in the provision for foreseeable loss for flats currently under development in FY 2024. \u003cbr /\u003e\n            \u003cbr /\u003e\n            When HDB begins development of new housing projects, provision is made for the estimated loss of these projects as HDB flats are sold at subsidised prices below their development cost. This provision is updated during the construction phase of the project, due to cost changes. With the completion of sales when keys are issued to flat buyers, the provision for foreseeable loss will then be released, and the actual loss from sales will be reflected (i.e. gross loss on the sale of flats).\u003cbr /\u003e\n            \u003cbr /\u003e\n            In FY 2024, about 23,600 flats commenced development while 14,900 flat sales were completed.\u003cbr /\u003e\n            \u003cdiv\u003e \u003c/div\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e\u003cstrong\u003eDisbursement of CPF Housing Grants\u003c/strong\u003e\u003c/td\u003e\n            \u003ctd\u003e $881 million disbursed to eligible buyers of resale flats and Executive Condominiums in FY 2024. \u003c/td\u003e\n        \u003c/tr\u003e\n    \u003c/tbody\u003e\n\u003c/table\u003e\n \n\u003cp\u003e4\u003cspan style=\"white-space: pre;\"\u003e \t\u003c/span\u003eSeparately, HDB continued to upgrade and spruce up rental flats for lower-income Singaporeans and those in need of housing support in FY 2024. As a result, HDB spent about $159 million for the provision of rental flats to eligible tenants under the various rental housing schemes.\u003c/p\u003e\n\u003ch4\u003eUpgrading HDB Homes \u0026amp; Estates\u003c/h4\u003e\n\u003cp\u003e5\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eTo ensure that HDB towns keep pace with the evolving needs of residents, HDB regularly revitalises estates and flats through a suite of rejuvenation and upgrading programmes, which are heavily subsidised or fully funded by the Government. In FY 2024, HDB spent $532 million on upgrading programmes such as the Home Improvement Programme (HIP), Neighbourhood Renewal Programme (NRP), and Lift Upgrading Programme (LUP), 34% higher than the $396 million spent in FY 2023. The increase was due to more HIP projects reaching peak construction phase in FY 2024, when spending is typically highest.\u003c/p\u003e\n\u003cp\u003e6\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eHDB also spent $570 million on residential ancillary functions in FY 2024, including lease administration, provision and management of facilities such as car parks in housing estates, and planning and building administration. The 28% increase from $446 million in FY 2023 was largely attributed to higher expenditure on the Electrical Load Upgrading Programme (ELUP), as more HDB blocks were upgraded to accommodate residents\u0026rsquo; growing electricity needs.\u003c/p\u003e\n\u003ch4\u003eKeeping Public Housing Affordable and Accessible\u003c/h4\u003e\n\u003cp\u003e7\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eHDB remains committed to keeping public housing affordable and accessible. HDB provides significant market discounts for new flats and various housing grants to first-timer buyers of new and resale flats. As a result, 9 in 10 first-timer families who collected keys to their BTO flats in 2024 have been able to service their HDB housing loans using their CPF with little or no cash outlay.\u003c/p\u003e\n\u003cp\u003e8\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eTo meet housing demand, HDB will launch about 55,000 new flats from 2025 to 2027. Of these, 4,000 Shorter Waiting Time (SWT) flats will be offered per year in 2026 and 2027. This is part of our continued efforts to reduce waiting times and expand housing options for home buyers with more pressing housing needs.\u003c/p\u003e\n\u003cp\u003e9\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eWe will continue to review and refine our housing policies where necessary, to support the housing needs and aspirations of Singaporeans and ensure that public housing remains affordable, accessible and inclusive.\u003c/p\u003e\n\u003cbr /\u003e\n\u003cp class=\"Footnote\"\u003eNote: Figures are rounded off to the nearest billion/million and percentages are rounded off to the nearest whole number\u003c/p\u003e"}}}],"landing-page":[],"advisory-banner":[{"uid":"4e5382e8-6a69-4a43-884a-7af7d1250946","componentName":"AdvisoryBanner","dataSource":"","placeholders":{"advisory-banner":[]}}],"rich-text-format-page":[],"listing-content":[]}}}},"dictionary":{"Documentation":"Documentation","GraphQL":"GraphQL","Tracking":"Tracking"},"headLinks":[],"componentProps":{"28a1fc07-1fad-4a51-a53d-26ce6801cd88":{"pageInfoList":[{"id":"0AE3B2BB39AB43489A9AAB461F07962A","path":"/sitecore
