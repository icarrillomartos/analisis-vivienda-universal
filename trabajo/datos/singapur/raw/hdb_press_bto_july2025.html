pan class="PSkeleton w-100 placeholder-glow"><span class="col-12 placeholder placeholder-xs"></span></span><div class="border-end border-neutral-600 d-none d-lg-block my-2 h-75"></div></div></div><div class="ms-lg-auto d-flex flex-column flex-lg-row justify-content-lg-end p-0 container"><div style="width:400px"><span class="PSkeleton w-100 placeholder-glow"><span class="col-12 placeholder placeholder-xs"></span></span></div></div></div></footer></main></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"site":{"name":"hdbinfoweb","language":"en","hostName":"*"},"locale":"en","layoutData":{"sitecore":{"context":{"visitorIdentificationTimestamp":639262227307981700,"pageEditing":false,"site":{"name":"hdbinfoweb"},"pageState":"normal","language":"en","itemPath":"/hdb-pulse/news/2025/hdb-launches-10209-flats-in-the-july-2025-bto-and-sbf-sales-exercises"},"route":{"name":"hdb-launches-10209-flats-in-the-july-2025-bto-and-sbf-sales-exercises","displayName":"20250723-HDB-Launches-10209-Flats-in-the-July-2025-BTO-and-SBF-Sales-Exercises","fields":{"hidePage":{"value":false},"publishedDate":{"value":"2025-07-22T16:00:00Z"},"sidebar":{"value":false},"topicTags":[],"metaDescription":{"value":"HDB launched 10,209 flats for sale today, under the July 2025 Build-To-Order (BTO) and Sale of Balance Flats (SBF) exercises."},"navigationTitle":{"value":"HDB Launches 10,209 Flats in the July 2025 BTO and SBF Sales Exercises"},"pageDescrition":{"value":"HDB launched 10,209 flats for sale today, under the July 2025 Build-To-Order (BTO) and Sale of Balance Flats (SBF) exercises."},"pageTitle":{"value":"HDB Launches 10,209 Flats in the July 2025 BTO and SBF Sales Exercises"}},"databaseName":"web","deviceId":"fe5d7fdf-89c0-4d99-9aa3-b5fbd009c9f3","itemId":"42e3fc2d-39af-4af3-a1cd-2b5b94f805fd","itemLanguage":"en","itemVersion":1,"layoutId":"af038be7-4964-5e5b-8587-c77df5a9ad86","templateId":"69b30267-a6b6-52fa-9533-4766acd90000","templateName":"Destination Page","placeholders":{"homepage":[],"jss-main":[{"uid":"945be692-46dd-467d-b938-92344729ade6","componentName":"PageHeader","dataSource":"{42E3FC2D-39AF-4AF3-A1CD-2B5B94F805FD}","fields":{"hidePage":{"value":false},"publishedDate":{"value":"2025-07-22T16:00:00Z"},"sidebar":{"value":false},"topicTags":[],"metaDescription":{"value":"HDB launched 10,209 flats for sale today, under the July 2025 Build-To-Order (BTO) and Sale of Balance Flats (SBF) exercises."},"navigationTitle":{"value":"HDB Launches 10,209 Flats in the July 2025 BTO and SBF Sales Exercises"},"pageDescrition":{"value":"HDB launched 10,209 flats for sale today, under the July 2025 Build-To-Order (BTO) and Sale of Balance Flats (SBF) exercises."},"pageTitle":{"value":"HDB Launches 10,209 Flats in the July 2025 BTO and SBF Sales Exercises"}}}],"intent-landing-page":[],"destination-page":[{"uid":"c829f5d0-3683-4913-8990-a2225b800528","componentName":"BodyContent","dataSource":"{7081A34B-229E-4C18-9D01-90390700E5D3}","fields":{"bodyContent":{"value":"\u003cp style=\"text-align: center;\"\u003e- 2,171 BTO flats with waiting times of 3 years or less on offer in Bukit Panjang, Clementi, and Sembawang\u003cbr /\u003e\n\u003cbr /\u003e\n- 1,733 SBF flats on offer are completed flats\u003c/p\u003e\n\u003cp\u003eHDB launched 10,209 flats for sale today, under the July 2025 Build-To-Order (BTO) and Sale of Balance Flats (SBF) exercises. This includes:\u003cbr /\u003e\n\u003cbr /\u003e\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003e5,547 BTO flats offered across 8 projects in Bukit Merah, Bukit Panjang, Clementi, Sembawang, Tampines, Toa Payoh, and Woodlands; and\u003c/li\u003e\n    \u003cli\u003e4,662 SBF units, located islandwide\u003csup\u003e\u003ca href=\"#footnote1\" title=\"The new flat classification framework will not apply to existing HDB flats and non-Prime Location Public Housing flats launched before the October 2024 BTO exercise, when these units are re-offered for sale in SBF exercises.\"\u003e1\u003c/a\u003e\u003c/sup\u003e, which are offered for sale under the concurrent SBF exercise. \u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e2\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eIn this BTO sales exercise, 7 out of 10 BTO flats have waiting times of 4 years or less. This includes 1,396 Shorter Waiting Time (SWT) flats at Bangkit Breeze and Clementi Emerald, with waiting times of less than 3 years. Another 775 flats at Sembawang Beacon, the first BTO project to be launched in the new Sembawang North neighbourhood, will have a waiting time of 3 years. Flat buyers who are looking to move into their homes sooner can also consider applying under the SBF exercise, where 1,733 units or more than one-third of the SBF flats are already completed. \u003c/p\u003e\n\u003ch4\u003eWide Selection of Affordable Flats for Different Budgets and Needs\u003c/h4\u003e\n\u003cp\u003e3\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eA wide selection of flat types, ranging from 2-room Flexi to 3Gen flats, is available to cater to the diverse housing needs and budgets of Singaporeans. There are 4 Standard projects offered in Bukit Panjang, Sembawang, Tampines, and Woodlands. The remaining 4 projects are Prime projects in Bukit Merah, Clementi, and Toa Payoh.\u003c/p\u003e\n\u003ctable\u003e\n    \u003ctbody\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e\u003cstrong\u003eClassification\u003c/strong\u003e\u003c/td\u003e\n            \u003ctd\u003e\u003cstrong\u003eProject \u003c/strong\u003e\u003c/td\u003e\n            \u003ctd\u003e\u003cstrong\u003eTown\u003c/strong\u003e\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd rowspan=\"4\"\u003eStandard Projects\u003c/td\u003e\n            \u003ctd\u003e Bangkit Breeze\u003c/td\u003e\n            \u003ctd\u003eBukit Panjang\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e Sembawang Beacon\u003c/td\u003e\n            \u003ctd\u003eSembawang\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003eSimei Symphony\u003c/td\u003e\n            \u003ctd\u003eTampines\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003eWoodlands North Grove\u003c/td\u003e\n            \u003ctd\u003eWoodlands\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd rowspan=\"4\"\u003ePrime Projects\u003c/td\u003e\n            \u003ctd\u003e Alexandra Peaks\u003c/td\u003e\n            \u003ctd rowspan=\"2\"\u003eBukit Merah\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e Alexandra Vista\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e Clementi Emerald\u003c/td\u003e\n            \u003ctd\u003eClementi\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003eToa Payoh Ascent\u003c/td\u003e\n            \u003ctd\u003eToa Payoh\u003c/td\u003e\n        \u003c/tr\u003e\n    \u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e4\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eTo ensure affordability, all new flats are priced with significant market discounts. On top of the market discounts, Prime flats which command higher market values given their more favourable locational attributes, receive additional subsidies to ensure that they remain affordable, accessible, and inclusive to Singaporeans across a wider range of income levels. Hence, the selling prices for these new flats are substantially lower than the transacted prices of comparable resale flats. Correspondingly, Prime flats come with additional restrictions, including subsidy recovery upon first resale.\u003c/p\u003e\n\u003cp\u003e5\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eEligible first-timer (FT) families can also benefit from the Enhanced CPF Housing Grant (EHG) of up to $120,000. With the EHG, homebuyers can purchase a 3-room Standard flat starting from $162,000, or a 4-room Standard flat starting from $248,000. See \u003cspan style=\"text-decoration: underline;\"\u003eTable 1\u003c/span\u003e for the starting prices of the BTO flats before and after grants. More details on the BTO flat prices and nearby resale transactions can be found in \u003ca href=\"/-/media/hdb-pulse/news/2025/hdb-launches-10209-flats-in-the-july-2025-bto-and-sbf-sales-exercises/Annex-A-20250723.pdf\" target=\"_blank\"\u003eAnnex A\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTable 1: Flat Prices in July 2025 BTO Exercise\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n    \u003ctbody\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e\u003cstrong\u003eTown\u003c/strong\u003e\u003c/td\u003e\n            \u003ctd\u003e\u003cstrong\u003eProject\u003c/strong\u003e\u003c/td\u003e\n            \u003ctd\u003e\u003cstrong\u003eFlat \u003cbr /\u003e\n            Type\u003c/strong\u003e\u003c/td\u003e\n            \u003ctd\u003e\u003cstrong\u003eSelling Price\u003cbr /\u003e\n            (Excluding Grants)\u003c/strong\u003e\u003c/td\u003e\n            \u003ctd\u003e\u003cstrong\u003eSelling Price\u003cbr /\u003e\n            (Including Grants ^) \u003c/strong\u003e\u003c/td\u003e\n            \u003ctd\u003e\u003cstrong\u003eTransacted Prices of\u003cbr /\u003e\n            Resale Flats Nearby #\u003c/strong\u003e\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd colspan=\"6\"\u003e\u003cstrong\u003eStandard Projects\u003c/strong\u003e\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd rowspan=\"4\"\u003e Bukit Panjang\u003c/td\u003e\n            \u003ctd rowspan=\"4\"\u003eBangkit Breeze~\u003c/td\u003e\n            \u003ctd\u003e2-room Flexi\u003c/td\u003e\n            \u003ctd\u003eFrom $149,000\u003c/td\u003e\n            \u003ctd\u003eFrom $29,000\u003c/td\u003e\n            \u003ctd\u003e-\u003c/td\ umed EHG amounts are:\u003c/p\u003e\n\u003cp class=\"RTE_FootnoteLabel\"\u003ei) 2-room Flexi flat: $120,000\u003cbr /\u003e\nii) 3-room flat: $105,000 (Standard project) and $90,000 (Prime project)\u003cbr /\u003e\niii) 4-room flat: $80,000 (Standard project) and $55,000 (Prime project) \u003cbr /\u003e\niv) 5-room/3Gen flat: $55,000 (Standard project)\u003cbr /\u003e\nThe starting prices after grant amounts are illustrative. The actual grant amount received will depend on the household\u0026rsquo;s income and eligibility. Read more about \u003ca href=\"/buying-a-flat/flat-grant-and-loan-eligibility/couples-and-families/enhanced-cpf-housing-grant\"\u003eEHG on the HDB InfoWEB\u003c/a\u003e.\u003c/p\u003e\n\u003cp class=\"RTE_FootnoteLabel\"\u003e~ Prices include the costs of floor finishes, internal doors and sanitary fittings.\u003cbr /\u003e\n# Details on the comparable resale flats can be found on the HDB Flat Portal. The differences in attributes between the comparable resale flats and the BTO flats should be taken into account when making a comparison.\u003c/p\u003e\n\u003ch4\u003eHousing Options for Different Household Incomes\u003c/h4\u003e\n\u003cp\u003e6\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eInterested flat applicants will be able to choose from a wide selection of flats to suit their budgets and preferences. For example, based on typical selling prices:\u003cbr /\u003e\n\u003cbr /\u003e\n\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eEligible FT families with a monthly \u003cstrong\u003ehousehold income of $4,000\u003c/strong\u003e can receive an EHG of $80,000. With this, they can purchase \u003cstrong\u003ea 3-room flat in any of the Standard projects\u003c/strong\u003e, or a \u003cstrong\u003e4-room Standard flat in Sembawang Beacon\u003c/strong\u003e, using their CPF contributions to service their monthly mortgage payments, with little or no cash payment.\u003cbr /\u003e\n    \u003cbr /\u003e\n    \u003c/li\u003e\n    \u003cli\u003eEligible FT families with a \u003cstrong\u003emonthly household income of $7,000\u003c/strong\u003e can receive an EHG of $30,000. They can purchase \u003cstrong\u003ea 3-room Standard or Prime flat in any of the projects\u003c/strong\u003e, a \u003cstrong\u003e4-room Standard flat in Bangkit Breeze, Sembawang Beacon and Woodlands North Grove\u003c/strong\u003e, or a \u003cstrong\u003e5-room Standard flat in Bangkit Breeze and Sembawang Beacon\u003c/strong\u003e, using their CPF contributions to service their monthly mortgage payments, with little or no cash payment. \u003cbr /\u003e\n    \u003cbr /\u003e\n    \u003c/li\u003e\n    \u003cli\u003eEligible FT families with a monthly \u003cstrong\u003ehousehold income of $9,000\u003c/strong\u003e can receive an EHG of $5,000. They can purchase \u003cstrong\u003ea 3-room or a 4-room Standard or Prime flat in any of the projects, or a 5-room Standard flat in Bangkit Breeze, Sembawang Beacon and Woodlands North Grove\u003c/strong\u003e using their CPF contributions to service their monthly mortgage payments, with little or no cash payment.\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch4\u003eSubsidy Recovery Upon Resale for Prime Flats\u003c/h4\u003e\n\u003cp\u003e7\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eTo maintain fairness across all BTO flat owners, Prime flat owners are subject to a subsidy recovery upon resale and they will be required to pay HDB a percentage of the resale or valuation price (whichever is higher) of the flat upon selling it, after meeting the 10-year Minimum Occupation Period (MOP).\u003c/p\u003e\n\u003cp\u003e8\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eFor this sales exercise, we will increase the additional subsidies for the Prime flats at Alexandra Peaks, Alexandra Vista, Toa Payoh Ascent and Clementi Emerald to keep the flats affordable for more Singaporeans. The subsidy recovery rates will be 11% for Alexandra Peaks, Alexandra Vista and Toa Payoh Ascent, and 12% for Clementi Emerald. They are commensurate with the extent of the additional subsidies provided for the respective projects.\u003c/p\u003e\n\u003ch4\u003eSupporting Singaporeans\u0026rsquo; Housing Aspirations\u003c/h4\u003e\n\u003cp\u003e9\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eTo help more Singaporeans fulfil their home ownership aspirations, prospective home buyers can look forward to the following changes from the July sales exercises:\u003cbr /\u003e\n\u003cbr /\u003e\n\u003c/p\u003e\n\u003col style=\"list-style-type: lower-alpha;\"\u003e\n    \u003cli\u003eThe new Family Care Scheme (Proximity) will provide priority access to parents and their children, married or single, when they are applying for a new flat to live with or near each other. \u003cbr /\u003e\n    \u003cbr /\u003e\n    \u003c/li\u003e\n    \u003cli\u003eThe allocation quota for second-timer (ST) families buying 3-room and bigger BTO flats will be increased by 5% points to support their upgrading aspirations and right-sizing plans.\u003cbr /\u003e\n    \u003cbr /\u003e\n    \u003c/li\u003e\n    \u003cli\u003eThe Deferred Income Assessment (DIA) scheme for young couples will be expanded such that only one of the two parties needs to be a recent or current full-time student or National Serviceman. Previously, both parties needed to meet this requirement.\u003cbr /\u003e\n    \u003cbr /\u003e\n    \u003c/li\u003e\n    \u003cli\u003eThe Fresh Start Housing Grant will be increased to $75,000 (up from $50,000) to support eligible second-timer families to buy a new 2-room Flexi or 3-room Standard BTO or SBF flat on a shorter lease.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch4\u003eSecond Sale of Balance Flats Exercise in 2025\u003c/h4\u003e\n\u003cp\u003e10\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eIn addition to the BTO flats, HDB will offer 4,662 balance flats across various locations in a concurrent SBF sales exercise, providing greater options for home buyers. This is more than the 3,000 SBF units initially committed. Together with the 5,590 SBF flats launched in February 2025, this brings the total SBF supply this year to more than 10,200 flats \u0026ndash; the largest annual supply of SBF flats since 2016. This reflects our continued efforts to meet the strong housing demand and support buyers with more urgent housing needs.\u003c/p\u003e\n\u003cp\u003e11\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eLike BTO flats, the SBF flats are heavily subsidised and priced considerably lower than comparable resale flats. The starting prices before and after the EHG are set out in \u003cspan style=\"text-decoration: underline;\"\u003eTable 2\u003c/span\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTable 2: Starting Flat Prices of July 2025 SBF Exercise\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n    \u003ctbody\u003e\n        \u003ctr\u003e\n            \u003ctd rowspan=\"2\"\u003e\u003cstrong\u003eFlat Type \u003c/strong\u003e\u003c/td\u003e\n            \u003ctd colspan=\"2\"\u003e\u003cstrong\u003e Selling Prices\u003c/strong\u003e\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e\u003cstrong\u003e Before EHG\u003c/strong\u003e\u003c/td\u003e\n            \u003ctd\u003e\u003cstrong\u003eAfter EHG ^\u003c/strong\u003e\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e Community Care Apartment (CCA) #\u003cbr /\u003e\n            (30-year Lease)\u003c/td\u003e\n            \u003ctd\u003eFrom $81,000\u003c/td\u003e\n            \u003ctd\u003eFrom $5,000 *\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e 2-room Flexi \u003cbr /\u003e\n            (99-year / Remaining Lease)\u003c/td\u003e\n            \u003ctd\u003eFrom $111,000\u003c/td\u003e\n            \u003ctd\u003eFrom $6,000 *\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e 3-room\u003c/td\u003e\n            \u003ctd\u003eFrom $163,000\u003c/td\u003e\n            \u003ctd\u003eFrom $58,000\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e 4-room\u003c/td\u003e\n            \u003ctd\u003eFrom $224,000\u003c/td\u003e\n            \u003ctd\u003eFrom $144,000\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e5-room\u003c/td\u003e\n            \u003ctd\u003eFrom $351,000\u003c/td\u003e\n            \u003ctd\u003eFrom $296,000\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e3Gen\u003c/td\u003e\n            \u003ctd\u003eFrom $524,000\u003c/td\u003e\n            \u003ctd\u003eFrom $469,000\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n            \u003ctd\u003eExecutive\u003c/td\u003e\n            \u003ctd\u003eFrom $645,000\u003c/td\u003e\n            \u003ctd\u003eFrom $645,000\u003c/td\u003e\n        \u003c/tr\u003e\n    \u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp class=\"RTE_FootnoteLabel\"\u003e\u003cspan style=\"text-decoration: underline;\"\u003eNote\u003c/span\u003e:\u003cbr /\u003e\n- Selling prices are rounded up to the nearest thousand dollars. To check the remaining lease of each block, please refer to \u003ca rel=\"noopener noreferrer\" href=\"https://homes.hdb.gov.sg/home/sbf/intro\" target=\"_blank\"\u003eHDB Flat Portal\u003c/a\u003e.\u003cbr /\u003e\n^ Unless otherwise stated, the starting prices of the flats are based on 99-year leases / remaining leases. For illustration purposes, the assumed EHG amounts are:\u003c/p\u003e\n\u003cp class=\"RTE_FootnoteLabel\"\u003ei) CCA/2-room Flexi flat: $120,000\u003cbr /\u003e\nii) 3-room flat: $105,000\u003cbr /\u003e\niii) 4-room flat: $80,000\u003cbr /\u003e\niv) 5-room/3Gen flat: $55,000\u003c/p\u003e\n\u003cp class=\"RTE_FootnoteLabel\"\u003eThe starting prices after grant amounts are illustrative. The actual grant amount received will depend on the household\u0026rsquo;s income and eligibility. Read more about \u003ca href=\"/buying-a-flat/flat-grant-and-loan-eligibility/couples-and-families/enhanced-cpf-housing-grant\"\u003eEHG on the HDB InfoWEB\u003c/a\u003e.\u003cbr /\u003e\n# CCA prices include costs of pre-installed senior friendly fittings and features, and do not include the costs of the mandatory Basic Service Package and optional services.\u003cbr /\u003e\n* Buyers need to pay 5% of the published price using their CPF and/or cash savings when their EHG amount exceeds 95% of the published price.\u003c/p\u003e\n\u003cp\u003e12\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eUnder the new flat classification framework, eligible FT singles can apply for new 2-room Flexi flats islandwide across all projects, i.e. any Standard, Plus or Prime flats. The new flat classification framework will not apply to the SBF units that are re-offered for this SBF sales exercise, as these flats were first launched before the October 2024 BTO sales exercise when the new flat classification was implemented. However, eligible FT singles can still apply for any of the 2-room Flexi SBF flats islandwide in this SBF sales exercise. \u003c/p\u003e\n\u003ch4\u003eAdvice for Flat Buyers \u003c/h4\u003e\n\u003cp\u003e13\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eApplicants who wish to participate in the July 2025 BTO and SBF exercises must have a valid HDB Flat Eligibility (HFE) letter\u003csup\u003e\u003ca href=\"#footnote2\" title=\"The HFE letter will inform flat buyers upfront of their eligibility for a new or resale flat purchase, CPF housing grants, and HDB housing loan, including the respective grant and loan amounts. \"\u003e2\u003c/a\u003e\u003c/sup\u003e when they submit their flat application. HDB had earlier announced that potential flat applicants should apply for an HFE letter and submit all required documents by 15 May 2025, to ensure that they can obtain their HFE letters on time to participate in the July 2025 sales exercises.  \u003c/p\u003e\n\u003cp\u003e14\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eWhile HDB continues to process HFE letter applications, priority will be given to those who submitted all required documents by 15 May 2025. As earlier announced in May 2025, the HFE letter application e-Service will be temporarily unavailable from 23 to 30 Jul 2025, to enable HDB to prioritise our resources to support the sales exercises during this short but intense 8-day application period. Flat buyers with a valid HFE letter, or those who have already submitted an HFE letter application will not be affected. The HFE letter application e-Service will resume after 30 July 2025. More information on the HFE letter is available on the \u003ca href=\"/buying-a-flat/flat-grant-and-loan-eligibility/application-for-an-hdb-flat-eligibility-hfe-letter\"\u003eHDB InfoWEB\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e15\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eApplicants are encouraged to plan their finances carefully and select a suitable flat based on their budget and needs. Flat buyers should also take into consideration the revised Loan-to-Value (LTV) limit for HDB housing loans, which has been lowered from 80% to 75% since the October 2024 sales exercise.\u003c/p\u003e\n\u003cp\u003e16\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eFlat applicants may apply for 1 flat type in 1 town during the 8-day application period under either the BTO or SBF exercise, but not both. Applicants who wish to improve their chances of securing a flat are encouraged to apply for Standard BTO projects, where at least 90% of the 4-room and bigger flats are set aside for FT families and to monitor the flat application rates of the different HDB projects over the sales launch period, with the view of applying to projects with lower application rates, e.g. application rate of 1 or below. Information on application rates of projects is available on the HDB Flat Portal, and this is updated several times a day throughout the 8-day application window.\u003c/p\u003e\n\u003ch4\u003eApplications Open from 23 to 30 July 2025\u003c/h4\u003e\n\u003cp\u003e17\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eFlat applications can be made online via HDB Flat Portal from \u003cstrong\u003etoday (23 July 2025) to 30 July 2025\u003c/strong\u003e. \u003cstrong\u003eThere is no need to visit HDB Hub to get the information or make an application\u003c/strong\u003e. HDB will shortlist applicants using a computer ballot, and not on a first-come-first-served basis. Hence, \u003cstrong\u003eapplicants do not need to rush to submit applications\u003c/strong\u003e within the first few hours or even the first few days of the application period and can submit their applications any time during the 8-day launch period. More details on the application procedures can be found in \u003ca href=\"/-/media/hdb-pulse/news/2025/hdb-launches-10209-flats-in-the-july-2025-bto-and-sbf-sales-exercises/Annex-B-20250723.pdf\" target=\"_blank\"\u003eAnnex B\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e18\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eAll the information on the flats offered is available on the \u003ca rel=\"noopener noreferrer\" href=\"https://homes.hdb.gov.sg/home/landing\" target=\"_blank\"\u003eHDB Flat Portal\u003c/a\u003e or through scanning the QR code below. \u003c/p\u003e\n\u003ctable\u003e\n    \u003ctbody\u003e\n        \u003ctr\u003e\n            \u003ctd\u003e\u003cimg alt=\"\" src=\"/-/media/hdb-pulse/news/2025/hdb-launches-10209-flats-in-the-july-2025-bto-and-sbf-sales-exercises/QRcode.png?h=164\u0026amp;w=150\u0026amp;hash=29EF470B188CE7830568C8918CAB8E64\" /\u003e\u003c/td\u003e\n            \u003ctd\u003e\n            \u003cp\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003cstrong\u003eFirst-time visitors\u003cbr /\u003e\n            \u003c/strong\u003e\u003c/span\u003e\u003cspan style=\"background-color: inherit;\"\u003eYou will be directed to a transition page to verify the go.gov.sg URL.\u003cbr /\u003e\n            \u003c/span\u003e\u003cspan style=\"background-color: inherit;\"\u003eUpon verification, you will be directed to a link which contains gov.sg\u003c/span\u003e\u003c/p\u003e\n            \u003cp\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003eRepeat visitors\u003cbr /\u003e\n            \u003c/span\u003e\u003c/strong\u003e\u003cspan style=\"background-color: inherit;\"\u003eYou will be directed straight to a link which contains gov.sg\u003c/span\u003e\u003c/p\u003e\n            \u003c/td\u003e\n        \u003c/tr\u003e\n    \u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e19\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eApplicants without Internet access may seek support from their family members. Those who need further assistance, such as seniors without family support, may call the HDB Sales/ Resale Customer Service Line at 1800 \u0026ndash; 866 3066.\u003c/p\u003e\n\u003ch4\u003eNext BTO Exercise in October 2025 \u003c/h4\u003e\n\u003cp\u003e20\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eIn the next BTO exercise to be held in October 2025, we will launch about 9,100 flats across 8 towns located islandwide, in Ang Mo Kio, Bedok, Bishan, Bukit Merah, Jurong East, Sengkang, Toa Payoh, and Yishun. Seniors can also look forward to a fifth Community Care Apartment (CCA) project, which will be offered in Sengkang. Interested flat buyers must have a valid HFE letter. We encourage all flat buyers to apply for an HFE letter early and submit all required documents by 15 September 2025, if they wish to participate in the October 2025 sales exercise. More details on the projects including their classification categories will be shared during the October 2025 sales exercise. \u003c/p\u003e\n\u003cp\u003e21\u003cspan style=\"white-space: pre;\"\u003e\t\u003c/span\u003eHDB will continue to monitor the housing demand closely, making adjustments where necessary. With the planned offer of about 19,600 BTO flats in 2025, we will launch about 102,300 BTO flats from 2021 to 2025. \u003c/p\u003e\n\u003cp class=\"RTE_FootnoteLabel\"\u003e\u003csup\u003e\u003ca name=\"footnote\" id=\"footnote1\"\u003e1\u003c/a\u003e\u003c/sup\u003eThe new flat classification framework will not apply to existing HDB flats and non-Prime Location Public Housing flats launched before the October 2024 BTO exercise, when these units are re-offered for sale in SBF exercises.\u003c/p\u003e\n\u003cp class=\"RTE_FootnoteLabel\"\u003e\u003csup\u003e\u003ca name=\"footnote2\" id=\"footnote2\"\u003e2\u003c/a\u003e\u003c/sup\u003eThe HFE letter will inform flat buyers upfront of their eligibility for a new or resale flat purchase, CPF housing grants, and HDB housing loan, including the respective grant and loan amounts. \u003c/p\u003e"}}}],"landing-page":[],"advisory-banner":[{"uid":"4e5382e8-6a69-4a43-884a-7af7d1250946","componentName":"AdvisoryBanner","dataSource":"","placeholders":{"advisory-banner":[]}}],"rich-text-format-page":[],"listing-content":[]}}}},"dictionary":{"Documentation":"Documentation","GraphQL":"GraphQL","Tracking":"Tracking"},"headLinks":[],"componentProps":{"945be692-46dd-467d-b938-92344729ade6":{"pageInfoList":[{"id":"42E3FC2D39AF4AF3A1CD2B5B94F805FD","path":"/sitecore/content/hdbinfoweb/home/hdb-pulse/news/2025/hdb-launches-10209-flats-in-the-july-2025-bto-and-sbf-sales-exercises","navigationTitleField":{"value":"HDB Launches 10,209 Flats in the July 2025 BTO and SBF Sales Exercises"},"language":{"name":"en"},"url":{"path":"/hdb-pulse/news/2025/hdb-launches-10209-flats-in-the-july-2025-bto-and-sbf-sales-exercises"},"template":{"name":"Destination Page"}},{"id":"77701434456648DCA1CC3087B71BCADF","path":"/sitecore/content/hdbinfoweb/home/hdb-pulse/news","navigationTitleField":{"value":"News"},"language":{"name":"en"},"url":{"path":"/hdb-pulse/news"},"template":{"name":"Listing by Year"}},{"id":"C876274D132048E4B738647AF911251A","path":"/sitecore/content/hdbinfoweb/home/hdb-pulse","navigationTitleField":{"value":"HDB Pulse"},"language":{"name":"en"},"url":{"path":"/hdb-pulse"},"template":{"name":"Landing Page"}},{"id":"F66401F811BB529EB418A76E316A62A7","path":"/sitecore/content/hdbinfoweb/home","navigationTitleField":{"value":"Homepage"},"language":{"name":"en"},"url":{"path":"/"},"template":{"name":"App Route"}}],"homeRedirectUrl":"/homepage"}},"isIntranet":false,"sidebarData":{"parentItem":{"title":"News","href":"/hdb-pulse/news","key":"77701434456648DCA1CC3087B71BCADF","hasChildren":true,"className":"parent-item","children":[{"title":"BTO table template","href":"/hdb-pulse/news/bto-table-template","key":"1786CE74A9AA40718C4160E76E39C6CA","hasChildren":false,"className":null}]},"menuData":[{"title":"BTO table template","href":"/hdb-pulse/news/bto-table-template","key":"1786CE74A9AA40718C4160E76E39C6CA","hasChildren":false,"className":null}]},"sidebarError":"","currentItemPath":"/hdb-pulse/news/2025/hdb-launches-10209-flats-in-the-july-2025-bto-and-sbf-sales-exercises"},"__N_SSP":true},"page":"/[[...path]]","query":{"path":["hdb-pulse","news","2025","hdb-launches-10209-flats-in-the-july-2025-bto-and-sbf-sales-exercises"]},"buildId":"0b90673231a64632adf77","assetPrefix":"https://www.hdb.gov.sg","isFallback":false,"isExperimentalCompile":false,"gssp":true,"locale":"en","locales":["en"],"defaultLocale":"en","scriptLoader":[]}</script></body></html>
